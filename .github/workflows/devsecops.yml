  Dockerfile:
    needs: Dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Construire l'image Docker
        run: docker build -t breakableflask:ci .

      - name: Scanner l'image Docker avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: breakableflask:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Contrôler le fichier Dockerfile avec Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: '1'
